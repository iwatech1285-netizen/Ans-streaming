<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ans Anime</title>
    <meta name="description" content="Minimalist black-and-white anime streaming platform with advanced video embed management, direct video uploads, live player preview, and single-admin dashboard." />
    <meta property="og:title" content="Ans Anime" />
    <meta property="og:description" content="Minimalist black-and-white anime streaming platform with advanced video embed management, direct video uploads, live player preview, and single-admin dashboard." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Typography: Syne (Display) + Plus Jakarta Sans (Body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
    
    <!-- Production stylesheet fallback for direct GitHub Pages / (root) deployment -->
    <script type="module" crossorigin src="./assets/index.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index.css">
  </head>
  <body class="bg-black text-white antialiased selection:bg-white selection:text-black m-0 p-0 overflow-x-hidden">
    <div id="root">
      <!-- Universal pre-hydration loader with auto-timeout fallback -->
      <div id="app-preloader" style="min-height: 100vh; background-color: #000000; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: 'Plus Jakarta Sans', sans-serif; color: #ffffff; padding: 20px; text-align: center;">
        <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 20px;">
          <div style="width: 38px; height: 38px; background-color: #ffffff; border-radius: 8px; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 15px rgba(255,255,255,0.2);">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="#000000"><path d="M8 5v14l11-7z"/></svg>
          </div>
          <span style="font-size: 24px; font-weight: 800; letter-spacing: -0.02em;">Ans <span style="color: #a3a3a3;">Anime</span></span>
        </div>
        <div id="preloader-spinner" style="width: 28px; height: 28px; border: 2.5px solid rgba(255,255,255,0.15); border-top-color: #ffffff; border-radius: 50%; animation: spin 0.75s linear infinite;"></div>
        <div id="preloader-troubleshoot" style="display: none; margin-top: 18px; max-width: 320px;">
          <p style="font-size: 12px; color: #888888; margin-bottom: 12px;">Loading is taking longer than expected.</p>
          <button onclick="window.location.reload(true)" style="padding: 8px 16px; background-color: #ffffff; color: #000000; border: none; border-radius: 8px; font-size: 12px; font-weight: bold; cursor: pointer;">
            Refresh Page
          </button>
        </div>
        <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
      </div>
    </div>
    
    <noscript>
      <div style="padding: 30px; text-align: center; color: #fff; background: #000; font-family: sans-serif;">
        <h2>JavaScript is required</h2>
        <p>Please enable JavaScript in your browser settings to launch Ans Anime.</p>
      </div>
    </noscript>

    <!-- Primary Vite Entry Point (Bundled by Vite on build, transformed in dev) -->

    <!-- Static Production Fallback Loader:
         If deployed directly on GitHub Pages root / without a build step,
         and /src/main.tsx is blocked by browser, this loads the compiled ./assets/index.js.
    -->
    <script>
      window.addEventListener('error', function(e) {
        if (e.target && e.target.tagName === 'SCRIPT' && e.target.src && e.target.src.includes('main.tsx')) {
          console.warn('Browser could not execute unbundled /src/main.tsx. Loading compiled production bundle...');
          var bundle = document.createElement('script');
          bundle.type = 'module';
          bundle.crossOrigin = 'anonymous';
          bundle.src = './assets/index.js';
          document.body.appendChild(bundle);
        }
      }, true);
    </script>
  </body>
</html>
