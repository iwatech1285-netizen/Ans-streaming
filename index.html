<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ans Anime</title>
    <meta name="description" content="Minimalist black-and-white anime streaming platform with advanced video embed management, direct video uploads, live player preview, and single-admin dashboard." />
    <meta property="og:title" content="Ans Anime" />
    <meta property="og:description" content="Minimalist black-and-white anime streaming platform with advanced video embed management, direct video uploads, live player preview, and single-admin dashboard." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Typography: Syne (Display) + Plus Jakarta Sans (Body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
  </head>
  <body class="bg-black text-white antialiased selection:bg-white selection:text-black m-0 p-0 overflow-x-hidden">
    <div id="root">
      <!-- Fallback pre-hydration loader prevents raw white screen on slower connections -->
      <div style="min-height: 100vh; background-color: #000000; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: 'Plus Jakarta Sans', sans-serif; color: #ffffff;">
        <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 16px;">
          <div style="width: 36px; height: 36px; background-color: #ffffff; border-radius: 8px; display: flex; align-items: center; justify-content: center;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="#000000"><path d="M8 5v14l11-7z"/></svg>
          </div>
          <span style="font-size: 22px; font-weight: 800; letter-spacing: -0.02em;">Ans <span style="color: #a3a3a3;">Anime</span></span>
        </div>
        <div style="width: 28px; height: 28px; border: 2px solid rgba(255,255,255,0.15); border-top-color: #ffffff; border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
        <style>
          @keyframes spin { to { transform: rotate(360deg); } }
        </style>
      </div>
    </div>
    <noscript>
      <div style="padding: 20px; text-align: center; color: #fff; background: #111;">
        Please enable JavaScript to run Ans Anime.
      </div>
    </noscript>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
